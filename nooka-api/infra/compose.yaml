services:
  postgres:
    image: postgis/postgis:17-3.5-alpine
    environment:
      POSTGRES_DB: "${NOOKA_DB_NAME:-nooka}"
      POSTGRES_USER: "${NOOKA_DB_USER:-nooka}"
      POSTGRES_PASSWORD: "${NOOKA_DB_PASSWORD:-nooka}"
    ports:
      - "${NOOKA_DB_PORT:-5432}:5432"
    volumes:
      - nooka-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    environment:
      REDIS_PASSWORD: "${NOOKA_REDIS_PASSWORD:-}"
    command: >-
      /bin/sh -c 'if [ -n "$$REDIS_PASSWORD" ]; then exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"; else exec redis-server --appendonly yes; fi'
    ports:
      - "${NOOKA_REDIS_PORT:-6379}:6379"
    volumes:
      - nooka-redisdata:/data
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          if [ -n "$$REDIS_PASSWORD" ]; then redis-cli --no-auth-warning -a "$$REDIS_PASSWORD" ping | grep PONG; else redis-cli ping | grep PONG; fi
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: Dockerfile
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: "${NOOKA_DB_NAME:-nooka}"
      DB_USER: "${NOOKA_DB_USER:-nooka}"
      DB_PASSWORD: "${NOOKA_DB_PASSWORD:-nooka}"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: "${NOOKA_REDIS_PASSWORD:-}"
      DIRECTIONS_CACHE_ENABLED: "${DIRECTIONS_CACHE_ENABLED:-true}"
      DIRECTIONS_CACHE_TTL: "${DIRECTIONS_CACHE_TTL:-PT15M}"
      DIRECTIONS_CACHE_KEY_PREFIX: "${DIRECTIONS_CACHE_KEY_PREFIX:-nooka:directions:route:v1}"
      DIRECTIONS_CACHE_ORIGIN_GRID_DECIMALS: "${DIRECTIONS_CACHE_ORIGIN_GRID_DECIMALS:-3}"
      DIRECTIONS_CACHE_DESTINATION_GRID_DECIMALS: "${DIRECTIONS_CACHE_DESTINATION_GRID_DECIMALS:-5}"
      PORT: "8080"
      AUTH_ENABLED: "${NOOKA_AUTH_ENABLED:-false}"
      AUTH_EMAIL_ENABLED: "${NOOKA_AUTH_EMAIL_ENABLED:-false}"
      AUTH_EMAIL_HOST: "${NOOKA_AUTH_EMAIL_HOST:-}"
      AUTH_EMAIL_PORT: "${NOOKA_AUTH_EMAIL_PORT:-587}"
      AUTH_EMAIL_USERNAME: "${NOOKA_AUTH_EMAIL_USERNAME:-}"
      AUTH_EMAIL_PASSWORD: "${NOOKA_AUTH_EMAIL_PASSWORD:-}"
      AUTH_EMAIL_FROM: "${NOOKA_AUTH_EMAIL_FROM:-}"
      OAUTH_GOOGLE_CLIENT_ID: "${NOOKA_OAUTH_GOOGLE_CLIENT_ID:-}"
      OAUTH_APPLE_CLIENT_ID: "${NOOKA_OAUTH_APPLE_CLIENT_ID:-}"
      OAUTH_FACEBOOK_APP_ID: "${NOOKA_OAUTH_FACEBOOK_APP_ID:-}"
      OAUTH_FACEBOOK_APP_SECRET: "${NOOKA_OAUTH_FACEBOOK_APP_SECRET:-}"
      OAUTH_FACEBOOK_GRAPH_BASE_URL: "${NOOKA_OAUTH_FACEBOOK_GRAPH_BASE_URL:-https://graph.facebook.com}"
      OPENAPI_ENABLED: "${NOOKA_OPENAPI_ENABLED:-true}"
      DIRECTIONS_PROVIDER: "${DIRECTIONS_PROVIDER:-mapbox}"
      MAPBOX_ACCESS_TOKEN: "${MAPBOX_ACCESS_TOKEN:-}"
      MAPBOX_DIRECTIONS_BASE_URL: "${MAPBOX_DIRECTIONS_BASE_URL:-https://api.mapbox.com}"
      GOOGLE_ROUTES_API_KEY: "${GOOGLE_ROUTES_API_KEY:-}"
      GOOGLE_ROUTES_BASE_URL: "${GOOGLE_ROUTES_BASE_URL:-https://routes.googleapis.com}"
    ports:
      - "${NOOKA_API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  nooka-pgdata:
  nooka-redisdata: