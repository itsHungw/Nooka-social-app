spring:
  application:
    name: nooka-api

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:nooka}
    username: ${DB_USER:nooka}
    password: ${DB_PASSWORD:nooka}

  jpa:
    hibernate:
      # Flyway sở hữu schema. Không bao giờ để Hibernate tự sửa bảng —
      # `update` sẽ âm thầm làm hỏng dữ liệu khi entity đổi.
      ddl-auto: validate
    # Tắt Open Session In View: tránh lazy loading xảy ra ở tầng controller,
    # nơi không kiểm soát được số query.
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

server:
  port: ${PORT:8080}

logging:
  level:
    org.flywaydb: info
