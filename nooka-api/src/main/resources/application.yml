spring:
  application:
    name: nooka-api

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:nooka}
    username: ${DB_USER:nooka}
    password: ${DB_PASSWORD:nooka}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  modulith:
    events:
      completion-mode: delete
      jdbc:
        schema-initialization:
          enabled: false

  mvc:
    problemdetails:
      enabled: true

nooka:
  security:
    enabled: ${AUTH_ENABLED:true}
  firebase:
    project-id: ${FIREBASE_PROJECT_ID:}

springdoc:
  api-docs:
    enabled: ${OPENAPI_ENABLED:false}
  swagger-ui:
    enabled: ${OPENAPI_ENABLED:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

server:
  port: ${PORT:8080}

logging:
  level:
    org.flywaydb: info